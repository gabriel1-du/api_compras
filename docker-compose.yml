services:
  api-compras:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - mysql-db
    env_file:
      - .env
  mysql-db:
    image: mysql:8.0
    container_name: api-compras-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hola123
      MYSQL_DATABASE: compras_db
    ports:
      - "3307:3306"
    volumes:
      - db_data_local:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data_local:
