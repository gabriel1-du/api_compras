services:
  api-compras:
    build:
      context: .
      dockerfile: DockerFile  # Aquí Compose llama al Dockerfile y descarga JDK/Maven
    ports:
      - "8083:8083"
  mysql-db:
    image: mysql:8.0
    container_name: api-compras-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hola123
      MYSQL_DATABASE: compras_db
    ports:
      - "3307:3306"
    volumes:
      - db_data_local:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data_local: